version: "3.8"

services:
  localstack:
    image: localstack/localstack:latest
    container_name: data-pipeline-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,redshift,lambda,kinesis
      - DEBUG=1
      - DATA_DIR=/tmp/localstack_data
      - DOCKER_HOST=unix:///var/run/docker.sock
      - LAMBDA_EXECUTOR=docker
      - DISABLE_CORS_CHECKS=1
      - EAGER_SERVICE_LOADING=1
      - SKIP_SSL_CERT_DOWNLOAD=1
      - DISABLE_EVENTS=1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - INIT_SCRIPTS_PATH=/docker-entrypoint-initaws.d
    volumes:
      - "./data-pipeline-localstack:/tmp/localstack_data"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "../localstack.sh:/docker-entrypoint-initaws.d/localstack.sh"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  spark-master:
    image: bitnami/spark:latest
    container_name: data-pipeline-spark-master
    ports:
      - "7077:7077"
      - "8081:8081"
      - "4040:4040"
      - "18080:18080"
    environment:
      - SPARK_MODE=master
      - JAVA_HOME=/opt/bitnami/java
      - SPARK_MASTER_WEBUI_PORT=8081
      - SPARK_LOCAL_STORAGE_DIR=/tmp/spark-events
    volumes:
      - ../data:/app/data
      - spark_events:/tmp/spark-events
    networks:
      - default
      - spark-network

  spark-worker:
    image: bitnami/spark:latest
    container_name: data-pipeline-spark-worker
    ports:
      - "8082:8082"
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://data-pipeline-spark-master:7077
      - JAVA_HOME=/opt/bitnami/java
      - SPARK_WORKER_WEBUI_PORT=8082
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - SPARK_EXECUTOR_MEMORY=2g
      - SPARK_EXECUTOR_CORES=2
      - SPARK_DAEMON_MEMORY=1g
    volumes:
      - ../data:/app/data
      - spark_events:/tmp/spark-events
    networks:
      - default
      - spark-network

  postgres:
    image: postgres:13
    container_name: data-pipeline-postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: data-pipeline-airflow
    depends_on:
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_started
      localstack:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__FERNET_KEY=9UunW9lUEzgQznW0acy4h-bQxQe_mFqjhLGekuwKtaw=
      - AIRFLOW__WEBSERVER__SECRET_KEY=8a2cc4651e3923182f32d3583ab2523c763a57b55ed83472495145dad4616672
      - AIRFLOW__KUBERNETES_EXECUTOR__IN_CLUSTER=False
      - AIRFLOW__KUBERNETES_EXECUTOR__NAMESPACE=default
      - AIRFLOW__WEBSERVER__WORKERS=1
      - AIRFLOW__WEBSERVER__WORKER_REFRESH_INTERVAL=0
      - AIRFLOW__WEBSERVER__WORKER_TIMEOUT=300
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      - SCOPE_TYPE=organization
      - AIRFLOW_CONN_AWS_DEFAULT=aws://test:test@data-pipeline-localstack:4566
      # - AIRFLOW_CONN_SPARK_DEFAULT=spark://spark://data-pipeline-spark-master:7077
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/logs:/opt/airflow/logs
      - ../airflow/plugins:/opt/airflow/plugins
      - ../airflow/config:/opt/airflow/config
      - ../scripts:/opt/airflow/scripts
      - ../.env:/opt/airflow/.env
      - ../src/:/opt/airflow/src/
    networks:
      - default
      - spark-network
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      bash -c "
      airflow db init &&
      airflow users create --username admin --firstname admin --lastname admin --role Admin --email admin@example.com --password admin &&
      airflow scheduler & airflow webserver --port 8080"

  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      - zookeeper
    networks:
      - spark-network

  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOO_LOG4J_PROP=INFO,ROLLINGFILE
    networks:
      - spark-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: data-pipeline-redis
    ports:
      - "6379:6379"
    networks:
      - default
      - spark-network

  timescaledb:
    image: timescale/timescaledb:2.12.1-pg13
    container_name: data-pipeline-timescaledb
    environment:
      - POSTGRES_DB=metrics
      - POSTGRES_USER=metrics
      - POSTGRES_PASSWORD=metrics
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "metrics"]
      interval: 5s
      retries: 5

networks:
  default:
    driver: bridge
  spark-network:
    driver: bridge
    name: docker_spark-network

volumes:
  postgres_data:
    driver: local
  spark_events:
    driver: local
  timescale_data:
    driver: local
