apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow
  template:
    metadata:
      labels:
        app: airflow
    spec:
      containers:
      - name: airflow
        image: "{{ .Values.airflow.image }}"
        ports:
        - containerPort: {{ .Values.airflow.webserver.port }}
        env:
        - name: AIRFLOW__CORE__DAGS_FOLDER
          value: "{{ .Values.airflow.dags_folder }}"