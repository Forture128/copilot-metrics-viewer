apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
      - name: localstack
        image: "{{ .Values.localstack.image }}"
        ports:
        - containerPort: {{ .Values.localstack.port }}
        env:
        - name: SERVICES
          value: "{{ join "," .Values.localstack.services }}"
        - name: DEBUG
          value: "1"