# kafka-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: "{{ .Values.kafka.image }}"
        ports:
        - containerPort: {{ .Values.kafka.port }}
        env:
        - name: KAFKA_ADVERTISED_LISTENERS
          value: PLAINTEXT://localhost:{{ .Values.kafka.port }}
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "zookeeper:{{ .Values.kafka.zookeeper.port }}"